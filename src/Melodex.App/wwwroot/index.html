<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Melodex</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <div class="boot loading"><span class="spinner"></span> Loading Melodex…</div>
    </div>

    <div id="blazor-error-ui">

        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>

    <!-- As the browser's page (Melodex.Web.Browser), with the web view's Blazor, which the web view starts itself once it can talk to the app. -->
    <script src="js/cover.js"></script>
    <script src="js/scroll.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/ticker.js"></script>
    <script src="js/songmenu.js"></script>
    <script src="js/attempts.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
